[package]
name = "cache-manager"
version = "0.1.1"
description = "A cross-platform Redis management tool powered by Tauri"
authors = ["cache-manager"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "cache_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
parking_lot = "0.12"
tokio = { version = "1", features = ["full"] }
bytes = "1"
base64 = "0.22"
shlex = "1"
futures = "0.3"

# Redis client: supports single / cluster / sentinel / replica
fred = { version = "10", default-features = false, features = [
  "i-all",
  "enable-rustls",
  "replicas",
  "sentinel-client",
  "subscriber-client",
  "serde-json",
  "dns",
  "monitor",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
